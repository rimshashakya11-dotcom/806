server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Short URL for the SmartCare Health Console
    location = /smartcare  { return 302 /smartcare/health-console.html; }
    location = /smartcare/ { return 302 /smartcare/health-console.html; }

    # Show Markdown files as readable text in the browser
    location ~* \.md$ { default_type text/plain; charset utf-8; }

    location / { try_files $uri $uri/ =404; }
}
