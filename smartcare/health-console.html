<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SmartCare Health Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: private-clinic console — emerald rail with champagne-gold accents, ivory working canvas; serif display for names and figures, clean sans for data */
:root{
  --bg:#f6f2ea; --panel:#fffdf8; --panel2:#f2ede2; --ink:#1c1a16; --ink2:#59534a; --muted:#8e877b;
  --line:#e5dccb; --grid:#efe8db; --axis:#cdbfa6; --accent:#8c6a3c; --accent-ink:#fffdf8; --accent-soft:#f0e5cf;
  --gold:#c9a96e; --btn:#13241f; --btn-ink:#f1e2bf;
  --pulse:#c9a96e; --rail:#10201c; --rail-ink:#c8c0ad; --rail-active:#1b302a; --on-dark:#fbf6ea;
  --shadow:0 1px 2px rgba(40,30,10,.04),0 12px 28px -18px rgba(40,30,10,.22);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#6250d6;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --good-ink:#0a7a0a; --warn-ink:#8f6200; --crit-ink:#b42b2b;
  --div-neg:#2a78d6; --div-mid:#f1ede4; --div-pos:#d03b3b;
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1210; --panel:#121b18; --panel2:#17221e; --ink:#f2ecdf; --ink2:#c9c0ad; --muted:#8f8778;
  --line:#26312c; --grid:#1d2723; --axis:#3a4540; --accent:#d4b67c; --accent-ink:#15110a; --accent-soft:#2a2a1f;
  --gold:#d4b67c; --btn:#d4b67c; --btn-ink:#15110a;
  --rail:#070d0b; --rail-ink:#b9b09c; --rail-active:#15211d; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -18px rgba(0,0,0,.6);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
  --good-ink:#3fcf3f; --warn-ink:#fab219; --crit-ink:#ff7b7b;
  --div-neg:#3987e5; --div-mid:#24302b; --div-pos:#e66767; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1210; --panel:#121b18; --panel2:#17221e; --ink:#f2ecdf; --ink2:#c9c0ad; --muted:#8f8778;
  --line:#26312c; --grid:#1d2723; --axis:#3a4540; --accent:#d4b67c; --accent-ink:#15110a; --accent-soft:#2a2a1f;
  --gold:#d4b67c; --btn:#d4b67c; --btn-ink:#15110a;
  --rail:#070d0b; --rail-ink:#b9b09c; --rail-active:#15211d; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -18px rgba(0,0,0,.6);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
  --good-ink:#3fcf3f; --warn-ink:#fab219; --crit-ink:#ff7b7b;
  --div-neg:#3987e5; --div-mid:#24302b; --div-pos:#e66767; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
#root{min-height:100%;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-data)}
.num{font-variant-numeric:tabular-nums}

/* ---------- sign-in ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--rail)}
.login-art{position:relative;padding-inline:40px;padding-block:48px;color:var(--rail-ink);display:flex;flex-direction:column;justify-content:space-between;gap:24px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:20px;color:var(--on-dark)}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--pulse);box-shadow:0 0 0 4px rgba(226,72,61,.25);animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}}
.login-art h1{font-size:clamp(28px,4vw,44px);line-height:1.08;margin:0;color:var(--on-dark);max-width:14ch;text-wrap:balance;font-weight:800;letter-spacing:-.02em}
.login-art p{max-width:46ch;margin:0}
.ecg{width:100%;height:120px}
.ecg path{fill:none;stroke:var(--pulse);stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 3.2s linear infinite}
.ecg .base{stroke:rgba(255,255,255,.12);stroke-width:1;animation:none;stroke-dasharray:none;stroke-dashoffset:0}
@keyframes trace{to{stroke-dashoffset:0}}
.stats-strip{display:flex;flex-wrap:wrap;gap:22px;font-size:12px}
.stats-strip b{display:block;font-size:22px;color:var(--on-dark);font-family:var(--f-data);font-weight:500}
.login-form{background:var(--panel);padding-inline:40px;padding-block:48px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.login-form h2{margin:0;font-size:22px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink2)}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--crit);color:var(--on-dark)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--crit-ink);font-size:13px;min-height:1.2em;margin:0}
.demo{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.demo table{border-collapse:collapse;width:100%}
.demo td{padding:3px 6px 3px 0}
.demo button{background:none;border:0;color:var(--accent);font-weight:600;padding:0;text-decoration:underline}

/* ---------- app shell ---------- */
.app{min-height:100%;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto 1fr}
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--rail);color:var(--rail-ink);padding-inline:18px;padding-block:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar .brand{font-size:17px}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px}
.role{background:var(--rail-active);color:var(--on-dark);border-radius:999px;padding:3px 10px;font-weight:600}
.timer{font-family:var(--f-data)}
.topbar .btn.ghost{color:var(--on-dark);border-color:rgba(255,255,255,.25)}
.rail{background:var(--rail);padding-inline:10px;padding-block:14px;display:flex;flex-direction:column;gap:4px}
.rail button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:transparent;border:0;color:var(--rail-ink);padding:9px 12px;border-radius:8px;font-weight:500}
.rail button[aria-current="page"]{background:var(--rail-active);color:var(--on-dark);font-weight:600}
.rail button:hover:not(:disabled){background:var(--rail-active)}
.rail .count{font-family:var(--f-data);font-size:11px;background:var(--pulse);color:var(--on-dark);border-radius:999px;padding:1px 7px}
.rail .lock{font-size:11px;opacity:.6}
.main{padding-inline:22px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:24px;letter-spacing:-.01em;text-wrap:balance}
.page-head p{margin:2px 0 0;color:var(--ink2);max-width:72ch}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}

.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.filters label,.lbl{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
select,.input{font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:120px;text-transform:none;letter-spacing:0}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:700}
.kpi .n{font-size:12px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h2{font-size:15px;margin:0;font-weight:700}
.card h3{font-size:12px;margin:0;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.note{font-size:12px;color:var(--muted);margin:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--f-body);fill:var(--ink2);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.suppressed{padding:36px 10px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.tablewrap{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
table.data th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:8px;white-space:nowrap}
table.data td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:var(--panel2)}
.idlink{font-family:var(--f-data);background:var(--accent-soft);color:var(--ink);border:0;border-radius:5px;padding:2px 7px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.High,.st-high{color:var(--crit-ink)} .Moderate,.st-watch{color:var(--warn-ink)} .Low,.st-good{color:var(--good-ink)} .st-na,.st-info{color:var(--muted)}
.chip{display:inline-block;font-size:11px;background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:1px 6px;margin:1px 3px 1px 0}
.muted{color:var(--muted)}
.empty-name{color:var(--muted);font-style:italic}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;max-width:260px;z-index:20;line-height:1.35}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;z-index:30}

/* ---------- patient record ---------- */
.record-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-weight:800;color:var(--accent);font-size:18px;flex:none}
.record-head .id{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.record-head h1{margin:0;font-size:22px}
.record-head .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink2);font-size:13px;align-items:center}
.record-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.vitals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.vital{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;border-top:3px solid var(--line)}
.vital.good{border-top-color:var(--good)} .vital.watch{border-top-color:var(--warn)} .vital.high{border-top-color:var(--crit)}
.vital .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.vital .v{font-family:var(--f-data);font-size:20px;font-weight:500}
.vital .v small{font-family:var(--f-body);font-size:11px;color:var(--muted);margin-left:3px}
.vital .s{font-size:11.5px;font-weight:600}
.rec-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:14px}
.rings{display:flex;flex-direction:column;align-items:center;gap:10px}
.ringlegend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%;text-align:center;font-size:12px;color:var(--ink2)}
.ringlegend b{display:block;font-size:16px;color:var(--ink);font-family:var(--f-data);font-weight:500}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mgroup{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700;padding-top:10px}
.mrow{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:8px;border-bottom:1px solid var(--grid)}
.mrow .lab{font-size:13px;font-weight:600}
.mrow .lab small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.mrow .val{font-family:var(--f-data);font-size:15px;text-align:right;white-space:nowrap}
.mrow .val small{display:block;font-family:var(--f-body);font-size:11px}
.align{display:flex;flex-direction:column;gap:8px}
.align .item{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:8px;background:var(--panel2);border:1px solid var(--grid)}
.align .ico{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--on-dark)}
.ledger{width:100%;border-collapse:collapse;font-size:13px}
.ledger td{padding:5px 0;border-bottom:1px solid var(--grid)}
.ledger td:last-child{text-align:right;font-family:var(--f-data)}
.ledger tr.off td{color:var(--muted)}
.ledger tr.total td{font-weight:700;border-bottom:0;padding-top:8px}
.sim{display:flex;flex-direction:column;gap:10px}
.sim label{display:grid;grid-template-columns:minmax(0,96px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px}
.sim output{font-family:var(--f-data);text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.formgrid .wide{grid-column:1/-1}
.notes{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.notes .n{background:var(--panel2);border:1px solid var(--grid);border-radius:8px;padding:8px 10px;font-size:13px}
.notes .n small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--crit);border-radius:8px;padding:8px 10px;font-size:13px}
.feature-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.feature-list li{padding-left:16px;position:relative}
.feature-list li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.prose{max-width:75ch}
.prose p{margin:0 0 8px}
/* two-patient compare */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch}
.vs .who-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.vs .who-card.a{border-left:4px solid var(--s1)} .vs .who-card.b{border-left:4px solid var(--s2)}
.vs .badge{align-self:center;font-weight:800;color:var(--muted);font-size:13px}
table.cmp{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
table.cmp th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:8px;text-align:left}
table.cmp td{padding:7px 8px;border-bottom:1px solid var(--grid)}
table.cmp td.v{font-family:var(--f-data);white-space:nowrap}
table.cmp tr.sec td{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700;padding-top:12px;border-bottom:0}

.sugg{display:flex;flex-direction:column;gap:10px}
.sg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.sg-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sg-top b{font-family:var(--f-display);font-size:19px;font-weight:600}
.sg-when{margin-left:auto;font-size:12px;color:var(--muted)}
.sg-move{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-data);font-size:13px}
.sg-move .arrow{color:var(--gold);font-weight:700}
.sg-move .tgt{color:var(--good-ink);font-weight:600}
.sg p{margin:0;font-size:13.5px;color:var(--ink2)}
.meter{height:6px;border-radius:999px;background:var(--grid);overflow:hidden}
.meter span{display:block;height:100%;border-radius:999px;transition:width .2s}
.checks{list-style:none;margin:4px 0 0;padding:0;font-size:12.5px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px}
.findings{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.findings li::marker{color:var(--gold);font-family:var(--f-display);font-weight:700}
/* ---- luxury layer ---- */
body{font-size:14px;letter-spacing:.005em}
h1,h2,.brand,.kpi .v,.record-head h1,.vital .v,.login-art h1,.login-form h2,.stats-strip b{font-family:var(--f-display);font-variant-numeric:lining-nums}
.page-head h1{font-size:32px;font-weight:600;letter-spacing:0;line-height:1.1}
.card{border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;gap:10px}
.card h2{font-size:21px;font-weight:600;letter-spacing:0}
.card h3{color:var(--accent)}
.kpi,.vital,.filters,.record-head{border-radius:16px;box-shadow:var(--shadow)}
.kpi{padding:16px 18px;position:relative}
.kpi::after{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.kpi .v{font-size:38px;font-weight:600;line-height:1.05}
.vital .v{font-size:26px;font-weight:600}
.vital .v small{font-family:var(--f-body)}
.eyebrow{color:var(--accent);letter-spacing:.16em;font-size:10.5px}
.btn{background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:9px 18px;letter-spacing:.02em}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn.ghost{border-radius:999px}
.btn.sm{padding:6px 13px}
.brand{font-weight:700;font-size:24px;letter-spacing:.01em}
.brand .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(201,169,110,.22)}
.topbar{border-bottom:1px solid rgba(201,169,110,.28)}
.topbar .brand{font-size:22px}
.role{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.rail{padding-block:22px;gap:2px;border-right:1px solid rgba(201,169,110,.18)}
.rail button{padding:11px 14px;border-radius:10px;letter-spacing:.02em}

/* ---------- sign-in v4: constellation, 3D watch, animated entry ---------- */
.login{position:relative;height:100%;min-height:0;overflow:hidden;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.login-art{padding-block:32px;justify-content:space-between;isolation:isolate}
.login-art canvas.sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.login-art::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 50% at 70% 45%,rgba(201,169,110,.10),transparent 70%),linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35))}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:28px}
.hero h1{margin:0}
.hero h1 .w{display:inline-block;opacity:0;transform:translateY(22px);filter:blur(6px);animation:wordIn .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes wordIn{to{opacity:1;transform:none;filter:none}}
.ticker{display:flex;align-items:center;gap:10px;margin-top:18px;line-height:1.5em;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-ink)}
.ticker .live{width:8px;height:8px;border-radius:50%;background:#e2483d;box-shadow:0 0 0 0 rgba(226,72,61,.6);animation:livePing 1.6s infinite}
@keyframes livePing{70%{box-shadow:0 0 0 10px rgba(226,72,61,0)}100%{box-shadow:0 0 0 0 rgba(226,72,61,0)}}
.ticker .roll{position:relative;height:1.5em;line-height:1.5em;overflow:hidden;min-width:16ch;color:var(--gold);font-weight:600}
.ticker .roll span{position:absolute;inset:0;transform:translateY(110%);opacity:0;transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .55s}
.ticker .roll span.on{transform:none;opacity:1}
.ticker .roll span.out{transform:translateY(-110%);opacity:0}
.watch-wrap{perspective:900px;width:220px;animation:floaty 6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-10px)}}
.watch{transform-style:preserve-3d;transition:transform .25s ease-out;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.watch svg{display:block;width:220px;height:auto}
.watch .ring{fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:110px 142px;transition:stroke-dashoffset 1.8s cubic-bezier(.2,.7,.2,1)}
.watch .heart{transform-origin:center;transform-box:fill-box;animation:beat 1.05s ease-in-out infinite}
.watch .glare{animation:glare 7s ease-in-out infinite}
@keyframes glare{0%,100%{opacity:.05}50%{opacity:.16}}
.ring-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;margin-top:10px;font-size:11px;color:var(--rail-ink)}
.ring-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.ecg-row{position:relative}
.ecg-row .bpm{position:absolute;right:0;top:-6px;font-family:var(--f-data);font-size:12px;color:var(--rail-ink)}
.ecg-row .bpm b{font-size:20px;color:var(--on-dark);margin-right:4px}
.ecg{height:90px}
.ecg .spark{fill:#fff;filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 0 14px var(--gold))}
.stats-strip span{opacity:0;transform:translateY(12px);animation:wordIn .8s cubic-bezier(.2,.7,.2,1) forwards}
.login-form{position:relative;padding-block:28px;gap:14px;overflow:hidden}
.login-form>*{opacity:0;transform:translateX(24px);animation:slideIn .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes slideIn{to{opacity:1;transform:none}}
.login-form .eyebrow{display:flex;align-items:center;gap:8px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rolecard{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px;color:var(--ink);transition:transform .2s,border-color .2s,box-shadow .2s;overflow:hidden}
.rolecard:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 26px -18px rgba(0,0,0,.5)}
.rolecard[aria-pressed="true"]{border-color:var(--gold);background:var(--panel);box-shadow:inset 0 0 0 1px var(--gold)}
.rolecard .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--rail);color:var(--gold);margin-bottom:4px}
.rolecard b{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1}
.rolecard small{color:var(--muted);font-size:11.5px}
.rolecard::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(201,169,110,.22) 50%,transparent 70%);transform:translateX(-100%)}
.rolecard:hover::after{transform:translateX(100%);transition:transform .8s}
.ff{position:relative}
.ff input{width:100%;height:54px;padding:20px 44px 6px 14px;border-radius:12px;font-size:15px;border:1px solid var(--line);background:var(--panel2);transition:border-color .2s,box-shadow .2s,background .2s}
.ff input:focus{background:var(--panel)}
.ff label{position:absolute;left:15px;top:17px;font-size:14px;color:var(--muted);pointer-events:none;transition:all .18s ease}
.ff input:focus+label,.ff input:not(:placeholder-shown)+label{top:7px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ff input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,169,110,.18)}
.ff .eye{position:absolute;right:8px;top:9px;width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:8px;display:grid;place-items:center}
.ff .eye:hover{color:var(--ink);background:var(--panel2)}
.caps{font-size:12px;color:var(--warn-ink);display:flex;align-items:center;gap:6px;min-height:0}
.checks{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--ink2)}
.checks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.checks input{accent-color:var(--btn);margin-top:2px}
.login-form .btn.go{position:relative;color:var(--btn-ink);height:50px;font-size:15px;letter-spacing:.04em;overflow:hidden;border-radius:12px}
.login-form .btn.go::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 3.8s ease-in-out 1.5s infinite}
@keyframes sheen{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.btn.go .spin{display:none;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;margin-inline:auto}
.btn.go.busy .golbl{display:none}.btn.go.busy .spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both!important}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.lockring{display:flex;align-items:center;gap:10px}
.lockring svg circle{fill:none;stroke-width:3}
.secchips{display:flex;flex-wrap:wrap;gap:8px}
.secchips span{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.wipe{position:fixed;inset:0;z-index:50;background:var(--rail);display:grid;place-items:center;clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path .75s cubic-bezier(.7,0,.2,1)}
.wipe.on{clip-path:circle(150% at var(--x,50%) var(--y,50%))}
.wipe.off{opacity:0;transition:opacity .45s ease}
.wipe .wb{text-align:center;color:var(--on-dark)}
.wipe .wb h3{font-family:var(--f-display);font-size:40px;font-weight:600;margin:10px 0 0}
.wipe .wb p{color:var(--gold);margin:4px 0 0;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.wipe svg path{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:600;stroke-dashoffset:600;animation:trace 1.1s ease-out forwards}
@media (max-width:1100px){.watch-wrap{display:none}.hero{grid-template-columns:minmax(0,1fr)}}

/* ---- v4: live heart and BP tiles, voice, help & ask ---- */
.vital.anim{position:relative;overflow:hidden}
.vital.anim .vfx{position:absolute;right:8px;top:8px;width:58px;height:40px;pointer-events:none}
.hb .heart{transform-origin:50% 55%;transform-box:fill-box;animation:lubdub var(--beat,.85s) ease-in-out infinite}

@keyframes halo{0%{transform:scale(.8);opacity:.5}60%,100%{transform:scale(1.9);opacity:0}}

  art.addEventListener("pointerleave",()=>{mx=my=-999;});
  window.addEventListener("resize",size);

    if(!REDUCED)requestAnimationFrame(draw);};
  requestAnimationFrame(draw);
}

function startVoice(){
  if(!SR){toast("Voice commands need Chrome or Edge. You can type commands on Help & ask.");ST.view="help";ST.pid=null;renderApp();return;}
  if(REC){REC.stop();return;}
  REC=new SR();REC.lang="en-NZ";REC.interimResults=true;REC.maxAlternatives=1;
  const btn=$("#voice");btn&&btn.setAttribute("aria-pressed","true");voicePill("listen");
  REC.onresult=e=>{const r=e.results[e.results.length-1],t=r[0].transcript;voicePill(r.isFinal?"heard":"listen",t);if(r.isFinal){const out=runCommand(t,"voice");setTimeout(()=>voicePill("heard",out),50);setTimeout(()=>voicePill("off"),2600);}};
  REC.onerror=e=>{voicePill("off");toast(e.error==="not-allowed"||e.error==="service-not-allowed"?"Microphone is blocked here. Open SmartCare_Dashboard.html in Chrome or Edge and allow the microphone.":e.error==="no-speech"?"No speech heard. Try again.":"Voice error: "+e.error);};
  REC.onend=()=>{REC=null;const b=$("#voice");b&&b.setAttribute("aria-pressed","false");setTimeout(()=>{if(!REC)voicePill("off");},2600);};
  try{REC.start();}catch(err){REC=null;voicePill("off");toast("Could not start the microphone.");}
}
const VIEWWORDS=[[/needs? action|to ?do|today|alerts?|queue/,"today"],[/overview|dashboard|cohort/,"overview"],[/patients?( list)?$|all patients/,"patients"],[/compar/,"compare"],[/insight/,"insights"],[/help|question|faq/,"help"],[/account|password/,"account"],[/privacy|feature/,"about"],[/audit/,"audit"],[/users?|settings/,"users"]];
const TABWORDS=[[/summary/,"summary"],[/measure/,"measures"],[/care ?plan|goals?|plan/,"plan"],[/check.?in|symptom/,"checkin"],[/wh(a|ā)nau|family|access/,"whanau"],[/notes?|readings?|log/,"log"]];
function runCommand(raw,src){
  const t=raw.toLowerCase().replace(/[.,!?]/g," ").replace(/\s+/g," ").trim();
  const done=msg=>{log(`${src==="voice"?"Voice":"Typed"} command: ${t.slice(0,60)}`);return msg;};
  const idm=t.match(/\bp\s*((?:\d\s*){3,4})\b/);
  if(/^(stop|quiet|silence|cancel)/.test(t)){stopSpeak();return done("Stopped reading.");}
  if(/^(how|what|why|when|where|who|which|is|are|can|does|do|should|explain)\b/.test(t)&&!/^(what|who) (is|are) (patient )?p\s*\d/.test(t)){ST.view="help";ST.pid=null;ST.askQ=raw;renderApp();return done("Answering your question.");}
  if(/(sign|log) ?out/.test(t)){setTimeout(()=>signOut(),400);return done("Signing out.");}
  if(/larger|bigger|accessib/.test(t)){ST.a11y=true;try{localStorage.setItem("smartcare-a11y","1");}catch(e){}renderApp();return done("Larger text on.");}
  if(/standard|smaller|normal text/.test(t)){ST.a11y=false;try{localStorage.setItem("smartcare-a11y","0");}catch(e){}renderApp();return done("Standard text.");}
  if(idm){const id="P"+idm[1].replace(/\s/g,"").padStart(4,"0").slice(-4),d=all().find(x=>x.PatientID===id);
    if(!d)return done(`No patient ${id}.`);openPatient(id);if(/read|speak|tell/.test(t))setTimeout(()=>speak(patientSpeech(all().find(x=>x.PatientID===id))),300);return done(`Opened ${id}.`);}
  if(/read|speak|tell me/.test(t)){if(ST.view==="patients"&&ST.pid){speak(patientSpeech(all().find(x=>x.PatientID===ST.pid)));return done("Reading the summary.");}
    if(ST.view==="today"){const a=alertList().filter(x=>!x.resolved);speak(`${a.length} open tasks. `+a.slice(0,4).map(x=>`${x.sev}: ${x.type} for ${x.d.PatientID.split("").join(" ")}`).join(". "));return done("Reading open tasks.");}
    return done("Open a patient record first, then say “read summary”.");}
  if(ST.view==="patients"&&ST.pid){for(const [re,k] of TABWORDS)if(re.test(t)&&!/patients/.test(t)){ST.rtab=k;viewRecord();return done(`Opened the ${k==="whanau"?"whānau":k} tab.`);}}
  for(const [re,v] of VIEWWORDS)if(re.test(t)){if((v==="audit"||v==="users")&&!can("audit"))return done("That page is for administrators.");ST.view=v;ST.pid=null;renderApp();return done(`Opened ${v==="today"?"Needs action":v}.`);}
  // not a command: answer it as a question
  ST.view="help";ST.pid=null;ST.askQ=raw;renderApp();return done("Answering your question.");
}

const STOP=new Set("a an the is are do does how what why when can i my me to of for in on and or with this that it be by at from show tell".split(" "));
function faqAnswer(q){const toks=q.toLowerCase().replace(/[^a-z0-9ā\s]/g," ").split(/\s+/).filter(w=>w&&!STOP.has(w));
  const sc=FAQ.map((f,i)=>{let s=0;for(const w of toks){if(f.k.includes(w))s+=3;if(f.q.toLowerCase().includes(w))s+=2;if(f.a.toLowerCase().includes(w))s+=.5;}return {i,s};}).sort((a,b)=>b.s-a.s);
  return {best:sc[0].s>=2.5?FAQ[sc[0].i]:null,related:sc.slice(sc[0].s>=2.5?1:0,4).filter(x=>x.s>0).map(x=>FAQ[x.i])};}
const PHI=q=>/\bp\s*\d{3,4}\b/i.test(q)||ST.records.some(r=>r.Name&&r.Name.length>3&&q.toLowerCase().includes(r.Name.toLowerCase().split(" ")[0]));

function bindPatientForm(r){

  $("#pform").addEventListener("submit",e=>{e.preventDefault();
    const g=k=>$("#pf_"+k).value;const rec=r?{...r}:{PatientID:"P"+(Math.max(...ST.records.map(x=>+x.PatientID.slice(1)))+1),Consent:"Active",Notes:[],Readings:[],AckList:[]};
    rec.Name=g("Name").trim().slice(0,80);rec.Gender=g("Gender");
    for(const k of ["Age","DailyStepCount","HeartRate_Avg","HeartRate_Min","HeartRate_Max","SleepDuration_Hours","SleepQualityScore","StressIndex","CalorieBurn","WeeklyHealthScore","FallAlerts"]){const val=num(g(k));if(val===null){$("#pfErr").textContent=`Enter a value for ${$("label[for=pf_"+k+"]").textContent}.`;return;}rec[k]=val;}
    for(const k of ["HeightCm","WeightKg","SBP","DBP","SpO2","HRV_ms","RespRate","SkinTempDev","VO2max","IrregularRhythm","SleepApnoea","HTNotify"])rec[k]=num(g(k));rec.ECG=g("ECG")||null;
    if(rec.HeartRate_Min>rec.HeartRate_Avg||rec.HeartRate_Avg>rec.HeartRate_Max){$("#pfErr").textContent="Heart rates must satisfy resting ≤ average ≤ peak.";return;}
    if((rec.SBP===null)!==(rec.DBP===null)){$("#pfErr").textContent="Enter both systolic and diastolic blood pressure, or neither.";return;}
    if(r){const i=ST.records.findIndex(x=>x.PatientID===r.PatientID);ST.records[i]=rec;log("Updated record",rec.PatientID);save();toast("Record saved. Risk tier recalculated.");renderApp();}
    else{ST.records.push(rec);log("Added patient",rec.PatientID);save();toast(`Patient ${rec.PatientID} added.`);openPatient(rec.PatientID);}
  });
}

function ring(s,cx,cy,r,frac,col,w=14){S("circle",{cx,cy,r,fill:"none",stroke:css("--grid"),"stroke-width":w},s);const f=Math.max(0,Math.min(1,frac)),c=2*Math.PI*r;

function pctile(key,val){const vals=active().map(d=>d[key]).filter(v=>v!=null);if(vals.length<3||val==null)return null;return Math.round(100*vals.filter(v=>v<val).length/vals.length);}

function alignment(d){
  const out=[],add=(lvl,t)=>out.push({lvl,t});

  if(d.SleepDuration_Hours<7&&d.StressIndex>=70)add("high","Sleep and stress are aligned in the wrong direction: short sleep alongside high stress. Address both together.");
  else if(d.SleepDuration_Hours<7)add("watch","Short sleep without high stress. Look at routine, pain or environment.");
  else if(d.StressIndex>=70)add("watch","High stress despite adequate sleep. Stress is not explained by sleep; discuss other stressors.");
  else add("good","Sleep and stress are aligned and within range.");
  if(!hasBP)add("na","Blood pressure not recorded. Add a cuff reading to check heart rate and blood pressure together.");
  else if(bpHigh&&d.HeartRate_Avg>=90)add("high",`Heart rate and blood pressure are both elevated (${d.HeartRate_Avg} bpm, ${d.SBP}/${d.DBP} mmHg). Recommend GP cardiovascular review.`);
  else if(bpHigh)add("high",`Blood pressure ${d.SBP}/${d.DBP} mmHg is high while heart rate is not elevated. Repeat the reading and refer to GP.`);
  else if(d.HeartRate_Avg>=90)add("watch",`Average heart rate is elevated (${d.HeartRate_Avg} bpm) but blood pressure ${d.SBP}/${d.DBP} is ${bpOk?"normal":"borderline"}. Check activity, stress and medication.`);
  else add("good","Heart rate and blood pressure are aligned and within range.");
  if(hasBP&&bpHigh&&d.SleepDuration_Hours<7)add("watch","Short sleep alongside high blood pressure; poor sleep can raise blood pressure, so the sleep plan supports BP control.");
  if(d.StressIndex>=70&&d.HeartRate_Min>=62)add("watch",`Resting heart rate (${d.HeartRate_Min} bpm) is in the top third of this cohort alongside high stress, a pattern consistent with physiological stress.`);
  if(d.DailyStepCount<5000&&d.BMI!=null&&d.BMI>=30)add("high",`Low activity with BMI ${d.BMI}. Prioritise a graded walking plan.`);
  else if(d.DailyStepCount<5000)add("watch","Sedentary week (under 5,000 steps).");
  if(d.FallAlerts===1)add(d.DailyStepCount>9000?"watch":"high",d.DailyStepCount>9000?"Fall alert in a very active week. It may be a movement artefact; confirm with the patient before acting.":"Fall alert recorded. Contact within 48 hours.");
  if(d.HeartRate_Max>208-.7*d.Age)add("watch",`Peak heart rate ${d.HeartRate_Max} bpm exceeds the age-predicted maximum (${Math.round(208-.7*d.Age)}). Review for arrhythmia or sensor error.`);
  if(d.SpO2!=null&&d.SpO2<92)add("high",`Low blood oxygen (${d.SpO2}%). Clinical review today.`);
  const C=d.CI;

  else if(C.recent){const sc=k=>C.s[k]||0;

    else if(sc("breath")>=2)add("watch","Feels breathless but the watch's oxygen and breathing readings are normal or missing. Check in person.");
    if(sc("dizzy")>=2&&(d.FallAlerts===1||d.HeartRate_Max>208-.7*d.Age))add("high","Reports dizziness and the watch shows a fall alert or a very high peak heart rate. These agree; prioritise a falls and rhythm review.");
    if(sc("sleepq")>=2&&d.SleepDuration_Hours>=7)add("watch",`Feels sleep is poor although the watch shows ${fmt(d.SleepDuration_Hours,1)} h. Ask about waking, pain or snoring.`);
    if(sc("sleepq")<=1&&d.SleepDuration_Hours<6)add("watch",`Says sleep is fine but the watch shows only ${fmt(d.SleepDuration_Hours,1)} h. Check the watch is worn overnight.`);
    if(sc("mood")>=2&&d.StressIndex>=70)add("watch","Low mood or worry in the check-in matches the high stress index.");}
  if(d.VC.notify)out.unshift({lvl:"high",t:`${d.VC.outs.length} overnight vitals are outside this patient's personal range (${d.VC.outs.map(o=>`${o.l.toLowerCase()} ${o.out}`).join(", ")}). Several moving together often signals illness before symptoms.`});
  else if(d.VC.ready)add("good",`Overnight vitals within personal range (${d.VC.ready} of 5 with a baseline).`);
  if(d.DQ.st==="high")add("watch",`Device data gap (${d.DQ.label.toLowerCase()}). Normal-looking numbers may be incomplete.`);
  if(d.HTNotify===1&&!hasBP)add("watch","The watch flagged possible hypertension but no cuff reading is on file. Log blood pressure with a cuff for 7 days.");
  if(d.HTNotify===1&&bpHigh)add("high","The watch's hypertension notification agrees with the cuff reading. Treat as confirmed high blood pressure pending GP review.");
  if(d.HTNotify===1&&bpOk)add("watch","The watch flagged possible hypertension but the cuff reading is normal. Repeat cuff readings before acting.");
  if(d.ECG==="Atrial fibrillation"||d.IrregularRhythm===1)add("high",`Possible atrial fibrillation${d.HeartRate_Max>208-.7*d.Age?", alongside a peak heart rate above the age-predicted maximum":""}. GP review and 12-lead ECG.`);
  if(d.SleepApnoea===1)add(d.SleepDuration_Hours<7||(hasBP&&bpHigh)?"high":"watch",`Sleep apnoea notification${d.SleepDuration_Hours<7?" with short sleep":""}${hasBP&&bpHigh?" and high blood pressure":""}. These often go together; refer for a sleep study.`);
  if(d.SkinTempDev!=null&&d.SkinTempDev>1)add("watch",`Wrist temperature is ${d.SkinTempDev} °C above baseline. Check for fever or infection.`);
  if(d.HRV_ms!=null&&d.HRV_ms<20&&d.StressIndex>=70)add("watch",`Low heart-rate variability (${d.HRV_ms} ms) with high stress: recovery is poor.`);
  return out;
}
function plan(d){
  const p=[];
  if(d.FallAlerts===1)p.push("Confirm the fall within 48 h; if confirmed, start strength-and-balance training and a home hazard check.");
  if(d.SpO2!=null&&d.SpO2<92)p.push("Same-day clinical review for low blood oxygen.");
  if(d.SBP!=null&&(d.SBP>=140||d.DBP>=90))p.push("GP blood-pressure review; repeat cuff readings weekly.");
  if(d.HeartRate_Avg>=90)p.push("GP heart-rate review if the average stays at 90 bpm or above for two weeks.");
  if(d.SleepDuration_Hours<7||d.SleepQualityScore<60)p.push("Sleep-hygiene coaching; refer for CBT-I if poor sleep persists.");
  if(d.StressIndex>=70)p.push("Wellbeing check-in and stress-management support.");
  if(d.DailyStepCount<7500)p.push(`Graded walking plan: aim for ${fmt(Math.min(d.DailyStepCount+1000,10000))} steps a day over the next fortnight.`);
  if(d.BMI!=null&&d.BMI>=30)p.push("Offer a dietitian referral alongside the activity plan.");
  if(!p.length)p.push("Maintain current habits; monthly light-touch check-in.");
  return p;
}

function drawHistory(host,pts,key,bl){
  if(!pts.length){host.innerHTML=`<p class="note">No dated readings yet. Add a reading or import device data to start a trend line.</p>`;return;}
  const W=560,H=150,m={l:44,r:14,t:10,b:26},s=svg(W,H,host),ys=pts.map(p=>p.y).concat(bl&&bl.ready?[bl.lo,bl.hi]:[]),[a,b]=[Math.min(...ys),Math.max(...ys)],pad=(b-a)||Math.max(1,Math.abs(a)*.05),y0=a-pad*.3,y1=b+pad*.3;
  const x=i=>pts.length===1?(W+m.l-m.r)/2:m.l+(W-m.l-m.r)*i/(pts.length-1),y=v=>m.t+(H-m.t-m.b)*(1-(v-y0)/(y1-y0));
  if(bl&&bl.ready){S("rect",{x:m.l,y:y(bl.hi),width:W-m.l-m.r,height:y(bl.lo)-y(bl.hi),fill:css("--gold"),opacity:.18},s);const t=S("text",{x:W-m.r-4,y:y(bl.hi)-4,"text-anchor":"end","font-size":10},s);t.textContent="personal typical range";}
  else{const band=M[key].bands?.find(bd=>bd[2]==="good");if(band){const lo=Math.max(band[0],y0),hi=Math.min(band[1],y1);if(hi>lo)S("rect",{x:m.l,y:y(hi),width:W-m.l-m.r,height:y(lo)-y(hi),fill:css("--good"),opacity:.1},s);}}
  [y0,(y0+y1)/2,y1].forEach(t=>{S("line",{x1:m.l,x2:W-m.r,y1:y(t),y2:y(t),stroke:css("--grid")},s);S("text",{x:m.l-6,y:y(t)+4,"text-anchor":"end"},s).textContent=fmt(t,(y1-y0)<10?1:0);});
  S("path",{d:pts.map((p,i)=>(i?"L":"M")+x(i)+","+y(p.y)).join(""),fill:"none",stroke:css("--s1"),"stroke-width":2},s);
  const every=Math.ceil(pts.length/8);
  pts.forEach((p,i)=>{const out=bl&&bl.ready&&i===pts.length-1&&bl.out;tipOn(S("circle",{cx:x(i),cy:y(p.y),r:out?7:4.5,fill:css(out?"--crit":"--s1"),stroke:css("--panel"),"stroke-width":2},s),`${p.x}${p.sim?" (simulated)":""}<br><b>${fmt(p.y,M[key].dec||0)} ${M[key].unit}</b>`);if(i%every===0||i===pts.length-1)S("text",{x:x(i),y:H-8,"text-anchor":"middle","font-size":10},s).textContent=p.x.slice(5);});
}

function viewCompare(){
  const v=active(),allv=all();
  if(!ST.cmp.a){const hi=allv.filter(d=>d.RiskTier==="High");ST.cmp.a=(hi[0]||allv[0]).PatientID;}
  if(!ST.cmp.b){ST.cmp.b=(allv.find(d=>d.RiskTier==="Low"&&d.PatientID!==ST.cmp.a)||allv.find(d=>d.PatientID!==ST.cmp.a)).PatientID;}

  const xs=ST.cmp.x,ys=ST.cmp.y,both=v.filter(d=>d[xs]!=null&&d[ys]!=null),rho=both.length>=8?spearman(both.map(d=>d[xs]),both.map(d=>d[ys])):NaN;

  const ccell=(d,k)=>{const v=d[k],c=CAT[k];return v==null?'<td class="v muted">—</td>':`<td class="v"><span class="st-${c.st(v)}">${c.show?c.show(v):esc(v)}</span></td>`;};

        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill ${A.RiskTier}">${A.RiskTier} · ${A.RiskScore} pts</span><span class="note">${A.Age} yrs · ${A.Gender} · ${A.Segment}</span><button type="button" class="btn ghost sm" data-open="${A.PatientID}">Open</button></div></div>
      <span class="badge">VS</span>
      <div class="who-card b"><label class="lbl" for="pb">Patient B</label>${pick("pb",B.PatientID)}
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill ${B.RiskTier}">${B.RiskTier} · ${B.RiskScore} pts</span><span class="note">${B.Age} yrs · ${B.Gender} · ${B.Segment}</span><button type="button" class="btn ghost sm" data-open="${B.PatientID}">Open</button></div></div>
  </section>
  <section class="cmp3 fill">
    <div class="card"><div class="head"><h2>Percentile profile</h2><div class="legend"><span><i style="background:var(--s1)"></i>A</span><span><i style="background:var(--s2)"></i>B</span></div></div><div class="chart" id="butterfly"></div></div>
    <div class="card"><h2>Every measurement</h2><div class="tablewrap scroll"><table class="cmp"><thead><tr><th>Measure</th><th>A</th><th>B</th><th>A − B</th></tr></thead><tbody>

        <tr><td>Risk score</td><td class="v">${A.RiskScore} <span class="pill ${A.RiskTier}">${A.RiskTier}</span></td><td class="v">${B.RiskScore} <span class="pill ${B.RiskTier}">${B.RiskTier}</span></td><td class="v">${A.RiskScore-B.RiskScore>0?"+":""}${A.RiskScore-B.RiskScore}</td></tr>

        <tr><td>Device data</td><td class="v"><span class="st-${A.DQ.st}">${A.DQ.label}</span></td><td class="v"><span class="st-${B.DQ.st}">${B.DQ.label}</span></td><td></td></tr>
        <tr><td>Fall alert</td><td class="v">${A.FallAlerts?'<span class="st-high">Yes</span>':"No"}</td><td class="v">${B.FallAlerts?'<span class="st-high">Yes</span>':"No"}</td><td></td></tr>
        ${sections}</tbody></table></div></div>
    <div class="card"><div class="head"><h2>Two measures</h2><span class="pill">${isNaN(rho)?"Need 8+":`ρ = ${rho.toFixed(2)}`}</span></div>

  </section>`;
  $("#pa").addEventListener("change",e=>{ST.cmp.a=e.target.value;viewCompare();});

    if(pb!=null){tipOn(S("rect",{x:mid+1,y:yy+5,width:Math.max(2,len(pb)),height:14,rx:3,fill:css("--s2")},s),`<b>B · ${M[k].label}</b><br>${fmt(B[k],M[k].dec||0)} ${M[k].unit} · ${pb}th pct`);

  });

function alertList(){
  const out=[],add=(d,type,why)=>{const t=(d.Tasks||{})[type]||{},legacy=(d.AckList||[]).includes(type);out.push({d,type,why,sev:PROTOCOL[type].sev,status:t.status||(legacy?"resolved":"open"),step:t.step||0,hist:t.hist||[],resolved:(t.status||(legacy?"resolved":""))==="resolved"});};
  active().forEach(d=>{
    if(d.FallAlerts===1)add(d,"Fall alert",d.DailyStepCount>9000?"Very active week; may be a movement artefact":"Watch accelerometer");
    if(d.ECG==="Atrial fibrillation"||d.IrregularRhythm===1)add(d,"Possible AF",d.ECG==="Atrial fibrillation"?"Watch ECG":"Irregular rhythm notification");
    if(d.SpO2!=null&&d.SpO2<92)add(d,"Low SpO₂",`${d.SpO2}%`);
    if(d.VC.notify)add(d,"Vitals outliers",d.VC.outs.map(o=>`${o.l} ${o.out}`).join(", "));
    if(d.SBP!=null&&(d.SBP>=140||d.DBP>=90))add(d,"High blood pressure",`${d.SBP}/${d.DBP} mmHg`);
    if(d.SleepApnoea===1)add(d,"Sleep apnoea","Breathing disturbances notification");
    if(d.HTNotify===1&&d.SBP==null)add(d,"Hypertension notification","No cuff reading yet");
    if(d.RiskTier==="High")add(d,"High risk tier",`${d.RiskScore} points`);
    if(d.CI&&d.CI.recent&&d.CI.severe.length)add(d,"Symptom check-in",`Severe: ${d.CI.severe.join(", ").toLowerCase()} (${d.CI.date})`);
    if(d.DQ.st==="high")add(d,"Data gap",`${d.DQ.nights??"?"} of 7 nights worn${d.DQ.days!=null?` · last sync ${d.DQ.days} d ago`:""}`);
  });
  return out;

function pwChecks(u,p){return [["At least 10 characters",p.length>=10],["Upper and lower case letters",/[a-z]/.test(p)&&/[A-Z]/.test(p)],["At least one number",/\d/.test(p)],["At least one symbol",/[^A-Za-z0-9]/.test(p)],["Does not contain the username",!!p&&!p.toLowerCase().includes(u.toLowerCase())]];}
function pwMeter(u,p){const c=pwChecks(u,p),n=c.filter(x=>x[1]).length,lab=["Very weak","Very weak","Weak","Fair","Good","Strong"][n],col=n>=5?"--good":n>=3?"--warn":"--crit";
  return `<div class="meter"><span style="width:${n*20}%;background:var(${col})"></span></div><div class="note">Strength: <b>${lab}</b></div><ul class="checks">${c.map(([t,ok])=>`<li class="${ok?"st-good":"muted"}">${ok?"✓":"○"} ${t}</li>`).join("")}</ul>`;}

  const v=active(),n=v.length,pct=k=>Math.round(100*v.filter(d=>d[k]).length/n);
  const both=v.filter(d=>d.F_ShortSleep&&d.F_HighStress).length,ss=v.filter(d=>d.F_ShortSleep),as=v.filter(d=>!d.F_ShortSleep);
  const vars=["Age","DailyStepCount","HeartRate_Min","HeartRate_Max","HeartRate_Avg","SleepDuration_Hours","SleepQualityScore","StressIndex","CalorieBurn","WeeklyHealthScore"],LB={Age:"Age",...Object.fromEntries(Object.entries(M).map(([k,m])=>[k,m.label]))};
  const pairs=[];vars.forEach((a,i)=>vars.slice(i+1).forEach(b=>pairs.push([a,b,spearman(v.map(d=>d[a]),v.map(d=>d[b]))])));pairs.sort((x,y)=>Math.abs(y[2])-Math.abs(x[2]));
  const dim=ST.idim||"Segment",metric=ST.imet||"StressIndex",groups=[...new Set(v.map(d=>d[dim]))].sort();
  const findings=[
    `${pct("F_ShortSleep")}% of consented patients sleep under 7 hours; ${both} (${Math.round(100*both/n)}%) also have high stress.`,
    `Short sleepers average a stress index of ${fmt(mean(ss.map(d=>d.StressIndex)))} versus ${fmt(mean(as.map(d=>d.StressIndex)))} for those sleeping 7 hours or more.`,
    `Strongest relationship: ${LB[pairs[0][0]]} and ${LB[pairs[0][1]]} (ρ = ${pairs[0][2].toFixed(2)}). No pair reaches |ρ| 0.39, the reliable-detection threshold for about 50 patients.`,
    `${v.filter(d=>d.RiskTier==="High").length} patients are High tier; ${v.filter(d=>d.FallAlerts===1).length} fall alerts this week, ${v.filter(d=>d.FallAlerts===1&&d.DailyStepCount>9000).length} of them in very active weeks.`,
    `Average transparent readiness is ${fmt(mean(v.map(d=>d.Readiness)))}/100; ${v.filter(d=>d.RD.st==="high").length} patients are in “Rest & recover”.`,
    `${v.filter(d=>d.DQ.st!=="na").length} patients have device data; ${v.filter(d=>d.VC.ready>=2).length} have a personal baseline and ${v.filter(d=>d.VC.notify).length} have two or more overnight outliers.`,
    `${ST.records.filter(r=>r.SBP==null).length} patients still need a blood-pressure reading, and ${ST.records.filter(r=>!(r.Access||{}).language).length} have no language or access details recorded.`,
    `${v.filter(d=>d.CI&&d.CI.recent).length} patients completed a symptom check-in this week; ${v.filter(d=>Object.keys(d.Referrals).length).length} have a falls-prevention referral.`];
  $("#main").innerHTML=`
  <div class="page-head"><div><div class="eyebrow">Insights · aggregate only</div><h1>What the data is saying</h1><p>Calculated live from consented patients. Every table on this page is aggregated and suppresses groups under ${MINN}, so it is safe for analysts and reports.</p></div></div>
  <section class="card"><h2>Key findings this week</h2><ol class="findings">${findings.map(f=>`<li>${f}</li>`).join("")}</ol></section>
  <section class="ins3 fill">
    <div class="card"><div class="head"><h2>Group summary</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><label class="lbl" for="idim">Group by<select id="idim">${[["Segment","Segment"],["AgeGroup","Age group"],["Gender","Gender"],["RiskTier","Risk tier"],["ReadyBand","Readiness band"],["Language","Language (equity)"],["Ethnicity","Ethnicity (equity)"],["Digital","Digital confidence (equity)"],["Rurality","Rural / urban (equity)"],["DataStatus","Device data status"]].map(([k,l])=>`<option value="${k}" ${dim===k?"selected":""}>${l}</option>`).join("")}</select></label></div></div>
      <div class="tablewrap scroll"><table class="data" style="min-width:0"><thead><tr><th>Group</th><th>n</th><th>Ready</th><th>Sleep h</th><th>Steps</th><th>High tier</th><th>Device data</th></tr></thead><tbody>
      ${groups.map(g=>{const sub=v.filter(d=>d[dim]===g);if(sub.length<MINN)return `<tr><td>${esc(g)}</td><td class="muted" colspan="6">Suppressed (n &lt; ${MINN})</td></tr>`;
        return `<tr><td>${esc(g)}</td><td class="num">${sub.length}</td><td class="num">${fmt(mean(sub.map(d=>d.Readiness)))}</td><td class="num">${fmt(mean(sub.map(d=>d.SleepDuration_Hours)),1)}</td><td class="num">${fmt(mean(sub.map(d=>d.DailyStepCount)))}</td><td class="num">${Math.round(100*sub.filter(d=>d.RiskTier==="High").length/sub.length)}%</td><td class="num">${Math.round(100*sub.filter(d=>d.DQ.st!=="na").length/sub.length)}%</td></tr>`;}).join("")}
      </tbody></table></div></div>
    <div class="card"><div class="head"><h2>Distribution</h2><label class="lbl" for="imet">Measure<select id="imet">${["Readiness","StressIndex","SleepDuration_Hours","SleepQualityScore","DailyStepCount","HeartRate_Avg","CalorieBurn","WeeklyHealthScore"].map(k=>`<option value="${k}" ${metric===k?"selected":""}>${M[k].label}</option>`).join("")}</select></label></div><div class="chart" id="hist2"></div></div>
    <div class="card"><h2>Strongest relationships</h2><div class="tablewrap scroll"><table class="data" style="min-width:0"><thead><tr><th>Measure 1</th><th>Measure 2</th><th>Spearman ρ</th><th>Reading</th></tr></thead><tbody>
    ${pairs.slice(0,6).map(([a,b,r])=>`<tr><td>${LB[a]}</td><td>${LB[b]}</td><td class="mono">${r.toFixed(2)}</td><td>${Math.abs(r)>=.39?"Detectable":"Weak lead"}</td></tr>`).join("")}</tbody></table></div></div></section>`;
  $("#idim").addEventListener("change",e=>{ST.idim=e.target.value;viewInsights();});
  $("#imet").addEventListener("change",e=>{ST.imet=e.target.value;viewInsights();});
  const vals=v.map(d=>d[metric]),lo=Math.min(...vals),hi=Math.max(...vals),bins=8,w=(hi-lo)/bins||1,cnt=Array(bins).fill(0);vals.forEach(x=>cnt[Math.min(bins-1,Math.floor((x-lo)/w))]++);
  const W=560,H=230,m={l:36,r:10,t:10,b:34},s=svg(W,H,$("#hist2")),mx=Math.max(...cnt),bw=(W-m.l-m.r)/bins,y=c=>m.t+(H-m.t-m.b)*(1-c/mx);
  for(let i=0;i<=mx;i+=Math.max(1,Math.ceil(mx/4))){S("line",{x1:m.l,x2:W-m.r,y1:y(i),y2:y(i),stroke:css("--grid")},s);S("text",{x:m.l-6,y:y(i)+4,"text-anchor":"end"},s).textContent=i;}
  cnt.forEach((c,i)=>{const a=lo+i*w;tipOn(S("rect",{x:m.l+i*bw+2,y:y(c),width:bw-4,height:y(0)-y(c),rx:4,fill:css("--s1")},s),`${fmt(a,M[metric].dec||0)}–${fmt(a+w,M[metric].dec||0)} ${M[metric].unit}<br><b>${c} patients</b>`);
    S("text",{x:m.l+i*bw+bw/2,y:H-16,"text-anchor":"middle","font-size":10},s).textContent=fmt(a,M[metric].dec||0);});
  S("text",{x:(W+m.l)/2,y:H-2,"text-anchor":"middle"},s).textContent=`${M[metric].label} →`;
}

// tooltip + theme
const tip=$("#tip");
document.addEventListener("mousemove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(!t){tip.hidden=true;return;}tip.innerHTML=t.dataset.tip;tip.hidden=false;
  tip.style.left=Math.min(e.clientX+14,window.innerWidth-tip.offsetWidth-8)+"px";tip.style.top=Math.min(e.clientY+14,window.innerHeight-tip.offsetHeight-8)+"px";});
const rerender=()=>{if(ST.user)renderApp();};
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",rerender);
new MutationObserver(rerender).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
renderLogin();
</script>
